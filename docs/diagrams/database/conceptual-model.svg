ill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="182" x="571.5" y="163.2925">Custom events are independent</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="135" x="571.5" y="178.2412">of periods and courses.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="571.5" y="193.1899">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="169" x="571.5" y="208.1387">Assessment calendar entries</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="177" x="571.5" y="223.0874">are derived from assessments.</text></g><g id="elem_GMN17"><path d="M139,393.0986 L139,432.0986 L104.07,436.0986 L139,440.0986 L139,477.8423 A0,0 0 0 0 139,477.8423 L353,477.8423 A0,0 0 0 0 353,477.8423 L353,403.0986 L343,393.0986 L139,393.0986 A0,0 0 0 0 139,393.0986 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M343,393.0986 L343,403.0986 L353,403.0986 L343,393.0986 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="173" x="145" y="410.2925">Total registered course weight</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="138" x="145" y="425.2412">must not exceed 100%.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="145" y="440.1899">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="171" x="145" y="455.1387">Grades are optional and must</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="193" x="145" y="470.0874">respect the course grading scale.</text></g><!--link USER to PERIOD--><g id="link_USER_PERIOD"><path codeLine="28" d="M217.83,65.0986 C162.99,65.0986 63,