<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="594px" preserveAspectRatio="none" style="width:775px;height:594px;background:#FFFFFF;" version="1.1" viewBox="0 0 775 594" width="775px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="237" x="262.25" y="23.1318">UniTrack - Conceptual Data Model</text><!--class USER--><g id="elem_USER"><rect codeLine="18" fill="#F8FAFC" height="42.1973" id="USER" rx="2.5" ry="2.5" style="stroke:#475569;stroke-width:0.5;" width="62" x="226" y="44.0986"/><text fill="#1E293B" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="29" x="242.5" y="62.2305">User</text><text fill="#1E293B" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="56" x="229" y="78.3291">ENT-001</text></g><!--class PERIOD--><g id="elem_PERIOD"><rect codeLine="20" fill="#F8FAFC" height="42.1973" id="PERIOD" rx="2.5" ry="2.5" style="stroke:#475569;stroke-width:0.5;" width="112" x="7" y="167.5986"/><text fill="#1E293B" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="106" x="10" y="185.7305">Academic Period</text><text fill="#1E293B" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="56" x="35" y="201.8291">ENT-002</text></g><!--class COURSE--><g id="elem_COURSE"><rect codeLine="22" fill="#F8FAFC" height="42.1973" id="COURSE" rx="2.5" ry="2.5" style="stroke:#475569;stroke-width:0.5;" width="62" x="32" y="291.0986"/><text fill="#1E293B" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="46" x="40" y="309.2305">Course</text><text fill="#1E293B" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="56" x="35" y="325.3291">ENT-003</text></g><!--class ASSESSMENT--><g id="elem_ASSESSMENT"><rect codeLine="24" fill="#F8FAFC" height="42.1973" id="ASSESSM